server:
  port: 8080

spring:
  application:
    name: blueprints-api-security
  main:
    allow-bean-definition-overriding: true

# Este servicio actua como su propio Authorization Server (emite tokens en /auth/login)
# y como Resource Server (valida tokens entrantes). La validacion NO usa un jwk-set-uri
# externo: el par de llaves RSA se genera en memoria (JwtKeyProvider) y los beans
# JwtEncoder/JwtDecoder definidos en SecurityConfig usan esa misma llave.
blueprints:
  security:
    issuer: "https://decsis-eci/blueprints"
    token-ttl-seconds: 3600
